# golangci-lint configuration (v2 schema).
#
# Schema note: this file uses the golangci-lint *v2* schema (the `version: "2"`
# key is required by v2 and rejected by v1). Verified locally with
# golangci-lint v2.14.0 (built with go1.26.0), so the `lint` job in
# .github/workflows/ci.yml must pin a v2 release for the action's `version:`
# input; a v1 pin cannot read this file.
version: "2"

run:
  # v2's default deadline is too tight for a module that compiles x/crypto/ssh.
  timeout: 5m

linters:
  # default: standard == errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  # Listed explicitly (they are already part of "standard") so the intended set
  # is visible in the file and cannot silently drift with upstream defaults.
  enable:
    - govet
    - ineffassign
    - staticcheck

issues:
  # Report every occurrence. v2 otherwise hides repeats of the same message
  # after 3 occurrences (`max-same-issues: 3`) and stops at 50 per linter,
  # which silently masks further identical findings (e.g. unchecked
  # json.Encoder.Encode calls in the HTTP handlers) — a green run under those
  # caps would not mean the module is clean. 0 = no limit.
  max-issues-per-linter: 0
  max-same-issues: 0
